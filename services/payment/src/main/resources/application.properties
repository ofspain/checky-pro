spring.application.name=payment-service

spring.profiles.active=local

# --- Port: auth-service owns 8080, notification-service claimed 8082 to avoid that collision -
# this service claims 8083, the next free value, for the same reason (so all four services can run
# side-by-side locally without a port clash). ---
server.port=${SERVER_PORT:8083}

# --- Datasource: runtime role only, never the migration owner (T02 - Postgres table owners bypass
# GRANT/REVOKE entirely, so the app must never connect as the role that owns the payments schema's
# tables). ---
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/checky}
spring.datasource.username=${DB_USERNAME:payment_app}
spring.datasource.password=${DB_PASSWORD:payment-app-local-only}
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.connection-init-sql=SET search_path TO payments, public

# --- JPA: OutboxEvent (T04) is the first @Entity in this service - ddl-auto=validate is a
# read-only startup check that the entity mapping matches the real Flyway-owned schema, never
# mutates it, so a mapping mistake fails loudly at boot instead of on first use. Mirrors
# services/auth, services/crypto, and services/notification's own identical setting. ---
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# --- Flyway: disabled at runtime - migrations only ever run via the Maven plugin (checky), never
# by the running application, in any environment (mirrors every sibling service). ---
spring.flyway.enabled=false

# --- Kafka: shares the same local broker as every sibling service (services/auth/compose.local.yaml's
# EXTERNAL listener is mapped to host port 9094, not the Kafka-default 9092). group-id scopes this
# service's own consumer group separately, even though its first real @KafkaListener lands in a
# later task (T11) - set now so the property doesn't need revisiting then. ---
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9094}
spring.kafka.consumer.group-id=payment-service

# --- Outbox relay (T04, L8): OutboxRelay's own polling interval. Mirrors crypto-service's
# identical property name/default/env-var convention. ---
themistra.payment.outbox.relay-interval-ms=${OUTBOX_RELAY_INTERVAL_MS:2000}

# --- Resource server (T03, L10): this service validates JWTs minted by auth-service, never issues
# its own - JwtDecoder is Spring Boot's own autoconfigured bean, sourced from these standard
# properties, not a custom themistra.* key. Points at the local auth-service instance a developer
# runs alongside this one. issuer-uri is required alongside jwk-set-uri - Spring Boot only adds the
# JwtIssuerValidator when issuer-uri is set; jwk-set-uri alone validates signature/expiry but not
# iss (named lesson, confirmed in every sibling service's own identical properties). ---
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:8080/oauth2/jwks
spring.security.oauth2.resourceserver.jwt.issuer-uri=${AUTH_ISSUER_URI:http://localhost:8080}

# --- Actuator exposure: PublicEndpoints declares /actuator/info, /actuator/prometheus, and the
# health probe sub-paths public, but Spring Boot only exposes `health` over HTTP by default -
# without this, those paths 404 regardless of security config. show-details=never keeps the health
# response from leaking internal detail (agents.md Security rule). Mirrors every sibling service's
# own identical precedent. ---
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never

# --- Crypto Service client (T03, design §4c): base-url has a legitimate, usable k8s-DNS-style
# default (not a placeholder), so it is not forced-required - a real deployment's own Crypto
# Service k8s Service name may simply be "crypto-service", matching this default exactly. ---
themistra.payment.crypto.base-url=${CRYPTO_SERVICE_BASE_URL:http://crypto-service}
themistra.payment.crypto.attest-path=/internal/v1/attest
themistra.payment.crypto.watch-path=/internal/v1/watches
themistra.payment.crypto.connect-timeout-ms=2000
themistra.payment.crypto.read-timeout-ms=5000

# --- Crypto Service client auth (T06): client_credentials against auth-service's own token
# endpoint. Reuses the same PAYMENT_SERVICE_CLIENT_SECRET env var auth-service's own client
# registration reads (services/auth/application.properties) - one source of truth, not two. ---
themistra.payment.crypto.auth.token-uri=${CRYPTO_AUTH_TOKEN_URI:http://localhost:8080/oauth2/token}
themistra.payment.crypto.auth.client-id=${CRYPTO_AUTH_CLIENT_ID:payment-service}
themistra.payment.crypto.auth.client-secret=${PAYMENT_SERVICE_CLIENT_SECRET:payment-local-only}

# --- Invoice / expiry (design §4c, confirmed 2026-10-11, Q1/Q3): both values have sensible,
# already-decided defaults - exact-match tolerance is fixed at 0 (Q1), the 60-minute TTL is the
# confirmed default (Q3) - neither is forced-required. ---
themistra.payment.invoice.default-ttl-minutes=60
themistra.payment.invoice.amount-tolerance-base-units=0

# --- Receipts / S3 WORM (design §4c): both fields are genuinely required in non-local profiles.
# DEVIATION FROM DESIGN.MD'S OWN VERBATIM BLOCK, disclosed here (Phase 6 implementation notes
# have the full reasoning): design.md's own text gives these an empty ${VAR:} fallback, which
# would fail @NotBlank validation in every profile including local, contradicting the frozen
# brief's own AC5 ("succeeds in local with this task's own fixture values"). Given a concrete,
# non-blank local-only fake default instead - the exact same pattern crypto-service already uses
# for its own analogous S3 bucket field (themistra.crypto.snapshot.bucket=local-only-fake-
# observation-snapshots) - so a real RECEIPT_BUCKET/KMS_PUBLIC_KEYS_URL env var still overrides it
# in any real environment, but local dev (and this task's own tests) never see a blank value. ---
themistra.payment.receipt.bucket=${RECEIPT_BUCKET:local-only-fake-receipt-bucket}
themistra.payment.receipt.prefix=${RECEIPT_BUCKET_PREFIX:receipts/}
themistra.payment.receipt.region=${RECEIPT_BUCKET_REGION:us-east-1}
themistra.payment.receipt.kms-public-keys-url=${KMS_PUBLIC_KEYS_URL:http://localhost:9080/local-only-fake-verification-keys}

# --- Ledger anchor (ShedLock, design §4c): the anchor job itself is deferred for Phase 1/MVP
# (spec/payment-service's own Q4 resolution, task 21 skipped) - this property is declared now,
# per this task's own scope, but nothing reads it until/unless that job is ever built.
# T14 finding (2026-10-15): fixed from the original 5-field Unix cron syntax to Spring's own
# required 6-field format (seconds first) - a real application would otherwise crash on startup
# with "Cron expression must consist of 6 fields". Never caught before T14's own real
# end-to-end test, since no prior test in this pipeline booted a real Spring context with
# scheduling enabled. "0 0 3 * * *" = daily at 03:00:00, matching the original's own intent. ---
themistra.payment.ledger.anchor.cron=0 0 3 * * *

# --- Invoice expiry sweep (ShedLock, design §4c): read by InvoiceExpirySweepJob, task 8.
# T14 finding (2026-10-15): same 6-field fix as the anchor cron above - "0 */5 * * * *" = every
# 5 minutes, at second 0, matching the original's own intent. ---
themistra.payment.invoice.expiry-sweep.cron=0 */5 * * * *
