spring.application.name=notification-service

spring.profiles.active=local

# --- Port: services/auth owns 8080 (its own application.properties). This service defaults away
# from that so both can run side-by-side locally, per Kimi Phase 8 Finding #6 - services/crypto has
# the same latent conflict (no server.port of its own either) but fixing that is out of this task's
# own scope (never touch a sibling service's files). ---
server.port=${SERVER_PORT:8082}

# --- Datasource: runtime role only, never the migration owner (T02 - Postgres table owners bypass
# GRANT/REVOKE entirely, so the app must never connect as the role that owns the notifications
# schema's tables). ---
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/checky}
spring.datasource.username=${DB_USERNAME:notification_app}
spring.datasource.password=${DB_PASSWORD:notification-app-local-only}
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.connection-init-sql=SET search_path TO notifications, public

# --- JPA: no @Entity exists yet (first feature task's own scope) - ddl-auto=validate is a read-only
# startup check that stays harmless with zero entities, and is set now so no later task needs to
# revisit this line. Mirrors services/auth and services/crypto's own identical setting. ---
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# --- Flyway: disabled at runtime - migrations only ever run via the Maven plugin (checky), never by
# the running application, in any environment (mirrors both sibling services). ---
spring.flyway.enabled=false

# --- Kafka: shares the same local broker as services/auth and services/crypto
# (services/auth/compose.local.yaml's EXTERNAL listener is mapped to host port 9094). ---
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9094}

# --- Kafka consumer (T06): the first real @KafkaListener in this codebase. group-id scopes this
# service's own consumer group separately from any other service reading the same topics (there
# are none today, but the convention matters going forward). auto-offset-reset=latest (Kimi Phase 3
# Finding #5): a newly deployed/rebalanced consumer must not replay historical events - replaying
# old verification/reset links would resend stale, expired links; replaying old lifecycle events
# risks re-welcoming inactive accounts. IdempotencyGuard makes replay safe, but latest avoids the
# business cost of mass-replay by default. ---
spring.kafka.consumer.group-id=notification-service
spring.kafka.consumer.auto-offset-reset=latest

# --- Resource server (T03, L8): this service validates JWTs minted by auth-service, never issues
# its own - JwtDecoder is Spring Boot's own autoconfigured bean, sourced from these standard
# properties. Points at the local auth-service instance a developer runs alongside this one
# (services/auth's own local server.port=8080). issuer-uri is required alongside jwk-set-uri -
# Spring Boot only adds the JwtIssuerValidator when issuer-uri is set; jwk-set-uri alone validates
# signature/expiry but not iss. ---
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:8080/oauth2/jwks
spring.security.oauth2.resourceserver.jwt.issuer-uri=${AUTH_ISSUER_URI:http://localhost:8080}

# --- Actuator exposure: PublicEndpoints declares /actuator/info, /actuator/prometheus, and the
# health probe sub-paths public, but Spring Boot only exposes `health` over HTTP by default -
# without this, those paths 404 regardless of security config. Mirrors both sibling services'
# own identical precedent. ---
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never

# --- Email transport (T03, design §4c; impl per O2/Q2) ---
themistra.notification.email.from=no-reply@checky.pro
themistra.notification.email.transport=${EMAIL_TRANSPORT:ses}

# --- Link base URL (T03, design §4c; Q4 unresolved) - deliberately blank by default in local; see
# LinkPropertiesStartupValidation for why this is not a plain required property. ---
themistra.notification.link.base-url=${AUTH_EMAIL_LINK_BASE_URL:}

# --- Retry / backoff (T03, design §4c defaults; confirm real values via Q6) ---
themistra.notification.retry.max-attempts=5
themistra.notification.retry.initial-backoff-seconds=30
themistra.notification.retry.max-backoff-seconds=3600

# --- In-app stream (T03, design §4c; impl per O3/Q3) ---
themistra.notification.inapp.transport=sse
