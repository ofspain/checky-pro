# Crypto service configuration. No secrets in this file, ever (D-010) — RPC provider endpoints
# and API keys arrive as environment variables injected by External Secrets Operator in-cluster
# (Secrets Manager, ARCHITECTURE §8), or as local overrides for development.

spring.application.name=crypto-service

# --- Server ---
# 8082 locally so this can run alongside auth (8080) without a clash; overridden per environment.
server.port=${SERVER_PORT:8082}
server.shutdown=graceful

# --- Quorum policy (ARCHITECTURE §6.1) ---
# Launch posture: three commercially independent providers, two must agree. Self-hosted nodes
# replace the third commercial provider in month 1-3. A threshold below 2 is rejected at startup —
# no single-provider answer is ever fact.
themistra.crypto.quorum.provider-count=${QUORUM_PROVIDER_COUNT:3}
themistra.crypto.quorum.threshold=${QUORUM_THRESHOLD:2}

# --- Datasource: the `chain` schema (ARCHITECTURE 3.4) ---
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/checky}
spring.datasource.username=${DB_USERNAME:checky}
spring.datasource.password=${DB_PASSWORD:checky-local-only}
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=5000

# --- JPA: Flyway owns the schema; Hibernate only verifies (D-005) ---
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_schema=chain

# --- Flyway ---
spring.flyway.default-schema=chain
spring.flyway.schemas=chain
spring.flyway.create-schemas=true

# --- Security: this service is a resource server (ARCHITECTURE 8) ---
# JWT validation lives in every service - zero trust, required regardless of the edge. This
# service holds the only IAM role permitted to call kms:Sign, so it is the last one that should
# ever accept an unauthenticated caller.
#
# require-issuer defaults true: a deployment with no issuer refuses to start rather than run
# with authentication effectively off. Turning it off is a deliberate, visible act (cf. D-011).
themistra.crypto.security.issuer-uri=${AUTH_ISSUER_URI:}
themistra.crypto.security.require-issuer=${SECURITY_REQUIRE_ISSUER:true}
themistra.crypto.security.watch-scope=${WATCH_SCOPE:internal.chain:write}

# --- Observability ---
# Provider-disagreement rate and watcher lag are paged metrics (ARCHITECTURE §8).
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.otlp.metrics.export.enabled=false

# --- Chain providers (ARCHITECTURE §6.1) ---
# Three commercially independent providers per chain; 2-of-3 must agree. Endpoints and any keys
# embedded in them arrive from the environment (Secrets Manager via External Secrets in-cluster) —
# only the variable reference belongs in this file (D-010).
#
# A chain declared with fewer providers than the quorum threshold fails startup, on purpose:
# a service that runs below quorum will eventually attest on one provider's word.
#
#
# No chain is declared by default: a chain declared here with unset endpoints would fail startup,
# turning "not yet given work" into an outage. Deployments supply the block below with real values.
# Self-hosted nodes replace the third commercial provider in month 1-3 (§6.1). Public endpoints
# satisfy the shape but are not commercially independent — development only.
#themistra.crypto.chains[0].id=${ETHEREUM_CHAIN_ID:eip155:1}
#themistra.crypto.chains[0].providers[0].label=evm-provider-a
#themistra.crypto.chains[0].providers[0].endpoint=${ETHEREUM_RPC_A:}
#themistra.crypto.chains[0].providers[1].label=evm-provider-b
#themistra.crypto.chains[0].providers[1].endpoint=${ETHEREUM_RPC_B:}
#themistra.crypto.chains[0].providers[2].label=evm-provider-c
#themistra.crypto.chains[0].providers[2].endpoint=${ETHEREUM_RPC_C:}
