spring.application.name=crypto-service

# AC4 (T01): virtual threads enabled globally. agents.md names the watcher layer as the intended
# beneficiary; the risk of carrier-thread pinning elsewhere (JDBC, KMS calls) was accepted at the
# Phase 4 design-challenge gate (Finding 5) as a revisit-if-regressed item, not a blocker.
spring.threads.virtual.enabled=true

spring.profiles.active=local

# --- Datasource: runtime role only, never the migration owner (T02 Kimi Finding 2 — Postgres
# table owners bypass GRANT/REVOKE entirely, so the app must never connect as the role that owns
# the chain schema's tables). ---
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/checky}
spring.datasource.username=${DB_USERNAME:crypto_app}
spring.datasource.password=${DB_PASSWORD:crypto-app-local-only}
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.connection-init-sql=SET search_path TO chain, public

# --- JPA (T04 Kimi Finding 1): OutboxEvent is the first @Entity in this service. ddl-auto=validate
# is a read-only startup check that the entity mapping matches the real Flyway-owned schema - never
# mutates it - so a mapping mistake (e.g. a typo'd @Column name) fails loudly at boot instead of on
# first use. Mirrors services/auth's identical setting. hibernate.default_schema is not needed here
# - the connection-init-sql above already sets search_path. ---
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# --- Flyway: disabled at runtime (T02 Kimi Finding 3) - migrations only ever run via the Maven
# plugin (checky), never by the running application, in any environment. ---
spring.flyway.enabled=false

# --- Outbox / Kafka (T04, L5, R26): shares the same local Kafka broker as services/auth
# (services/auth/compose.local.yaml's EXTERNAL listener is mapped to host port 9094, not the
# Kafka-default 9092 - frozen brief amendment #4). KafkaProducerConfig builds the actual
# KafkaTemplate explicitly (not autoconfigured) from this property. ---
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9094}
themistra.crypto.outbox.relay-interval-ms=${OUTBOX_RELAY_INTERVAL_MS:2000}

# --- Resource server (T03, R27): this service validates JWTs minted by auth-service, never issues
# its own - JwtDecoder is Spring Boot's own autoconfigured bean, sourced from these standard
# properties (frozen brief amendment #8), not a custom themistra.* key. Points at the local
# auth-service instance a developer runs alongside this one (services/auth's own local
# server.port=8080 / spring.security.oauth2.authorizationserver.issuer). issuer-uri is required
# alongside jwk-set-uri (Phase 9 Finding 3) - Spring Boot only adds the JwtIssuerValidator when
# issuer-uri is set; jwk-set-uri alone validates signature/expiry but not iss. ---
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:8080/oauth2/jwks
spring.security.oauth2.resourceserver.jwt.issuer-uri=${AUTH_ISSUER_URI:http://localhost:8080}

# --- Actuator exposure (Phase 7/9 Finding): PublicEndpoints declares /actuator/info,
# /actuator/prometheus, and the health probe sub-paths public, but Spring Boot only exposes
# `health` over HTTP by default - without this, those paths 404 regardless of security config.
# Mirrors services/auth/application.properties's own identical precedent. ---
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never

# --- Providers (T03, design §4c): vendor-agnostic placeholders only - real provider set is
# unresolved (package.md §11 Q1). Never real provider URLs/keys (L13). ---
themistra.crypto.providers.chains[0].chain=ETHEREUM
themistra.crypto.providers.chains[0].providers[0].name=fake-ethereum-provider-a
themistra.crypto.providers.chains[0].providers[0].url=http://localhost:9901/fake-eth-a
themistra.crypto.providers.chains[0].providers[0].timeout-seconds=5
themistra.crypto.providers.chains[0].providers[0].api-key-secret-name=local-only-fake-provider-key
themistra.crypto.providers.chains[0].providers[1].name=fake-ethereum-provider-b
themistra.crypto.providers.chains[0].providers[1].url=http://localhost:9902/fake-eth-b
themistra.crypto.providers.chains[0].providers[1].timeout-seconds=5
themistra.crypto.providers.chains[0].providers[1].api-key-secret-name=local-only-fake-provider-key
themistra.crypto.providers.chains[1].chain=TRON
themistra.crypto.providers.chains[1].providers[0].name=fake-tron-provider-a
# T07 Phase 9 (Kimi Issue 1): this is a gRPC target (io.grpc.ManagedChannelBuilder.forTarget), not an
# HTTP URL - a bare host:port, unlike the ETHEREUM entries above which are real HTTP URLs for web3j's
# HttpService. The previous http://... value was a leftover from T03's original generic fixture,
# never revisited for Tron's different (trident/gRPC) transport until this task.
themistra.crypto.providers.chains[1].providers[0].url=localhost:9903
themistra.crypto.providers.chains[1].providers[0].timeout-seconds=5
themistra.crypto.providers.chains[1].providers[0].api-key-secret-name=local-only-fake-provider-key
themistra.crypto.providers.quorum-threshold=2

# --- Finality (T03, L4): enabled-chains list only - policy objects are hardcoded per chain
# (design §4a L4, task 14), never configurable confirmation counts. ---
themistra.crypto.finality.enabled-chains[0]=ETHEREUM
themistra.crypto.finality.enabled-chains[1]=TRON

# --- Screening (T03, L12): vendor unresolved (package.md §11 Q2); disabled locally, which is the
# valid local-profile shape - fake providers only, real vendor never called in tests/CI. ---
themistra.crypto.screening.enabled=false
themistra.crypto.screening.connect-timeout-seconds=5
themistra.crypto.screening.read-timeout-seconds=5
themistra.crypto.screening.retry-max-attempts=2

# --- Provider health (T10, R5): no threshold value is given anywhere in the spec for "repeatedly
# disagreeing" - 3 is this task's own justified, reviewable default. ---
themistra.crypto.provider-health.disagreement-threshold=3

# --- Token allowlist (T11, L7, R13/R14): config-driven seeding, not a Flyway DML migration (agents.md
# forbids DML in migrations). Clearly-fake placeholder addresses/signature - never real mainnet
# contracts this codebase has no way to verify, never a real signature (no signing key/algorithm is
# specified anywhere in this spec). Real production entries are an operational/deployment concern. ---
themistra.crypto.token-allowlist.entries[0].chain=ETHEREUM
themistra.crypto.token-allowlist.entries[0].contract-address=0x1111111111111111111111111111111111111a
themistra.crypto.token-allowlist.entries[0].symbol=USDT
themistra.crypto.token-allowlist.entries[0].decimals=6
themistra.crypto.token-allowlist.entries[0].version=1
themistra.crypto.token-allowlist.entries[0].signature=local-only-unsigned-placeholder
themistra.crypto.token-allowlist.entries[1].chain=ETHEREUM
themistra.crypto.token-allowlist.entries[1].contract-address=0x2222222222222222222222222222222222222b
themistra.crypto.token-allowlist.entries[1].symbol=USDC
themistra.crypto.token-allowlist.entries[1].decimals=6
themistra.crypto.token-allowlist.entries[1].version=1
themistra.crypto.token-allowlist.entries[1].signature=local-only-unsigned-placeholder
themistra.crypto.token-allowlist.entries[2].chain=TRON
themistra.crypto.token-allowlist.entries[2].contract-address=TFakeUSDTPlaceholder0000000000001
themistra.crypto.token-allowlist.entries[2].symbol=USDT
themistra.crypto.token-allowlist.entries[2].decimals=6
themistra.crypto.token-allowlist.entries[2].version=1
themistra.crypto.token-allowlist.entries[2].signature=local-only-unsigned-placeholder
themistra.crypto.token-allowlist.entries[3].chain=TRON
themistra.crypto.token-allowlist.entries[3].contract-address=TFakeUSDCPlaceholder0000000000002
themistra.crypto.token-allowlist.entries[3].symbol=USDC
themistra.crypto.token-allowlist.entries[3].decimals=6
themistra.crypto.token-allowlist.entries[3].version=1
themistra.crypto.token-allowlist.entries[3].signature=local-only-unsigned-placeholder

# --- KMS (T03, L11): config only, sole kms:Sign caller is the future attest module (task 20).
# Placeholder id - never a real key ARN committed. ---
themistra.crypto.kms.key-id=local-only-fake-kms-key-id

# --- S3 observation snapshot (T03, L3): config only, ObservationSnapshotStore lands in task 8. ---
themistra.crypto.snapshot.bucket=local-only-fake-observation-snapshots
themistra.crypto.snapshot.prefix=chain-observations/
themistra.crypto.snapshot.region=us-east-1

# --- EthereumAdapter (T06): subscribeAddress poll interval - fixed-delay (frozen brief amendment
# #4), so a slow poll delays the next one rather than overlapping. ---
themistra.crypto.adapter.ethereum.poll-interval-ms=${ETHEREUM_ADAPTER_POLL_INTERVAL_MS:15000}

# --- TronAdapter (T07): subscribeAddress poll interval - fixed-delay, same rationale as Ethereum's.
# Shorter default than Ethereum's (Tron's ~3s block time vs Ethereum's ~12s) so the per-poll catch-up
# cap (frozen brief amendment #5) isn't doing most of the work on every tick. ---
themistra.crypto.adapter.tron.poll-interval-ms=${TRON_ADAPTER_POLL_INTERVAL_MS:3000}
