# Crypto service configuration. No secrets in this file, ever (D-010) — RPC provider endpoints
# and API keys arrive as environment variables injected by External Secrets Operator in-cluster
# (Secrets Manager, ARCHITECTURE §8), or as local overrides for development.

spring.application.name=crypto-service

# --- Server ---
# 8082 locally so this can run alongside auth (8080) without a clash; overridden per environment.
server.port=${SERVER_PORT:8082}
server.shutdown=graceful

# --- Quorum policy (ARCHITECTURE §6.1) ---
# Launch posture: three commercially independent providers, two must agree. Self-hosted nodes
# replace the third commercial provider in month 1-3. A threshold below 2 is rejected at startup —
# no single-provider answer is ever fact.
themistra.crypto.quorum.provider-count=${QUORUM_PROVIDER_COUNT:3}
themistra.crypto.quorum.threshold=${QUORUM_THRESHOLD:2}

# --- Observability ---
# Provider-disagreement rate and watcher lag are paged metrics (ARCHITECTURE §8).
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.otlp.metrics.export.enabled=false
