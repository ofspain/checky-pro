# Local development profile.
#
# The only place authentication may be off. require-issuer defaults to true precisely so that a
# deployment cannot run without an issuer by omission — switching it off has to be an explicit,
# visible act, and this file is that act, scoped to a profile no deployment uses.
themistra.crypto.security.require-issuer=false

# Public no-key endpoints so the explorer works before any provider account exists. Note that a
# relay (e.g. flashbots) is not an RPC node — it 403s on eth_getTransactionReceipt, so it would
# fail every read and leave you at 2-of-2 with no tolerance.
# These are NOT a production posture: §6.1 requires three commercially independent providers,
# and free endpoints rate-limit under the real call pattern. Development only.
themistra.crypto.chains[0].id=eip155:1
themistra.crypto.chains[0].providers[0].label=publicnode
themistra.crypto.chains[0].providers[0].endpoint=${ETHEREUM_RPC_A:https://ethereum-rpc.publicnode.com}
themistra.crypto.chains[0].providers[1].label=drpc
themistra.crypto.chains[0].providers[1].endpoint=${ETHEREUM_RPC_B:https://eth.drpc.org}
themistra.crypto.chains[0].providers[2].label=merkle
themistra.crypto.chains[0].providers[2].endpoint=${ETHEREUM_RPC_C:https://eth.merkle.io}

# compose.local.yaml maps 5433 so this can run alongside auth's Postgres on 5432.
spring.datasource.url=jdbc:postgresql://localhost:5433/checky
