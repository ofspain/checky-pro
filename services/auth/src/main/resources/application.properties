# Auth service configuration. No secrets in this file, ever (D-010) — everything sensitive
# arrives as environment variables injected by External Secrets Operator in-cluster,
# or by compose.local.yaml defaults for local development.

spring.application.name=auth-service

# Default profile is local (agents.md: local/dev/staging/prod). The SPRING_PROFILES_ACTIVE env
# var (set per-environment in deploy/k8s/base.yaml) always takes precedence over this file, so
# this default only takes effect for local dev and for tests, neither of which sets that env var.
spring.profiles.active=local

# --- Datasource ---
# connection-init-sql sets the search_path on every pooled connection so unqualified table
# references resolve against the auth schema Flyway actually creates everything in - this
# matters for Spring Authorization Server's built-in repositories (oauth2_registered_client,
# oauth2_authorization, etc.), which use plain JdbcTemplate, not JPA, and so aren't covered by
# spring.jpa.properties.hibernate.default_schema below. Applies regardless of how the DataSource
# itself is constructed (works the same for the real datasource and for Testcontainers'
# @ServiceConnection-injected one, which bypasses spring.datasource.url entirely).
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/checky}
spring.datasource.username=${DB_USERNAME:checky}
spring.datasource.password=${DB_PASSWORD:checky-local-only}
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.connection-init-sql=SET search_path TO auth, public

# --- JPA: Flyway owns the schema; Hibernate only verifies (D-005). default_schema must mirror
# flyway.default-schema below - without it Hibernate validates against the connection's default
# search_path (public) instead of the auth schema Flyway actually created everything in. ---
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=auth
spring.jpa.open-in-view=false

# --- Flyway ---
spring.flyway.default-schema=auth
spring.flyway.schemas=auth
spring.flyway.create-schemas=true

# --- Kafka ---
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9094}

# --- Outbox relay (D-009): polling interval for unpublished events ---
themistra.auth.outbox.relay-interval-ms=${OUTBOX_RELAY_INTERVAL_MS:2000}

# --- OAuth2 / OIDC issuer ---
spring.security.oauth2.authorizationserver.issuer=${AUTH_ISSUER_URI:http://localhost:8080}
# Resource-server side of this service validates tokens against its own issuer
spring.security.oauth2.resourceserver.jwt.issuer-uri=${AUTH_ISSUER_URI:http://localhost:8080}

# --- OAuth2 clients: static provisioning (target-design §5), synced at startup ---
themistra.auth.clients.spa.client-id=checky-spa
themistra.auth.clients.spa.redirect-uris[0]=${SPA_REDIRECT_URI:http://localhost:5173/auth/callback}
themistra.auth.clients.spa.post-logout-redirect-uris[0]=${SPA_POST_LOGOUT_REDIRECT_URI:http://localhost:5173/}
themistra.auth.clients.services[0].client-id=payment-service
themistra.auth.clients.services[0].secret=${PAYMENT_SERVICE_CLIENT_SECRET:payment-local-only}
themistra.auth.clients.services[0].scopes[0]=internal.accounts:read
themistra.auth.clients.services[1].client-id=notification-service
themistra.auth.clients.services[1].secret=${NOTIFICATION_SERVICE_CLIENT_SECRET:notification-local-only}
themistra.auth.clients.services[1].scopes[0]=internal.accounts:read
themistra.auth.clients.services[2].client-id=crypto-service
themistra.auth.clients.services[2].secret=${CRYPTO_SERVICE_CLIENT_SECRET:crypto-local-only}
themistra.auth.clients.services[2].scopes[0]=internal.accounts:read

# --- JWT signing keys (D-011): current + previous PEM, injected by External Secrets in-cluster.
# require-configured=true in every non-local profile so a real deployment without real key
# material fails to boot rather than silently minting an ephemeral, non-durable dev key.
themistra.auth.jwt.current.kid=${JWT_CURRENT_KID:}
themistra.auth.jwt.current.private-key-pem=${JWT_CURRENT_PRIVATE_KEY_PEM:}
themistra.auth.jwt.previous.kid=${JWT_PREVIOUS_KID:}
themistra.auth.jwt.previous.private-key-pem=${JWT_PREVIOUS_PRIVATE_KEY_PEM:}
themistra.auth.jwt.require-configured=${JWT_REQUIRE_CONFIGURED:false}

# --- Verification / reset tokens ---
themistra.auth.verification-token.ttl-minutes=30

# --- Password policy (L2) ---
themistra.auth.password.min-length=12
themistra.auth.password.max-length=128
themistra.auth.password.breach-check.enabled=true
themistra.auth.password.breach-check.url-prefix=https://api.pwnedpasswords.com/range/
themistra.auth.password.breach-check.timeout-ms=3000

# --- Lockout (L4) ---
themistra.auth.lockout.max-attempts=5
themistra.auth.lockout.window-minutes=30
themistra.auth.lockout.base-lock-minutes=15

# --- MFA (L14, ADR-0003): TOTP issuer label and the KMS CMK ARN for seed envelope encryption.
# seed-kek-arn blank is only legal in the local profile (fixed local-dev key, no KMS call); any
# other profile fails startup on a blank ARN (L13). ---
themistra.auth.mfa.issuer-name=${MFA_ISSUER_NAME:Themistra}
themistra.auth.mfa.seed-kek-arn=${MFA_SEED_KEK_ARN:}

# --- Server ---
server.port=8080
server.shutdown=graceful

# --- Observability ---
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
# OTLP metrics export enabled per-environment via OTEL_* env in-cluster
management.otlp.metrics.export.enabled=false
