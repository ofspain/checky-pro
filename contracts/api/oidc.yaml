openapi: 3.0.3
info:
  title: SAS OIDC protocol surface (frontend-consumed subset)
  description: >
    The Spring Authorization Server protocol endpoints the SPA calls programmatically. It exists
    because design.md L6 requires every backend call to go through a client generated from
    contracts/api/*.yaml, and auth.yaml intentionally excludes the SAS protocol surface (see its
    own description, R47/T33 scope). Two files rather than one is therefore deliberate: this one
    is governed by SAS, not by auth-service's own controllers, and it is documented only as far as
    a consumer needs.

    Only endpoints a client calls programmatically belong here. /oauth2/authorize is a browser
    navigation, not a request, and is not documented. Adding any further path is a decision of its
    own, not a drive-by.
  version: "1.0"
servers:
  - url: /

paths:
  /oauth2/token:
    post:
      summary: Exchange an authorization code for tokens
      description: >
        checky-spa is a public client registered with ClientAuthenticationMethod.NONE, so the
        request carries no client credential of any kind and the PKCE code_verifier is the only
        proof that the code is being redeemed by the tab that requested it.
      operationId: exchangeToken
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRequest'
      responses:
        '200':
          description: The tokens for the redeemed code.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          description: >
            The code was not redeemable - unknown, already redeemed, expired, or presented with a
            verifier that does not match the challenge. SAS answers with an OAuth2 error object
            carrying `error` and `error_description`, and this contract deliberately gives the
            response no schema: design.md L4 forbids the visitor learning which check failed, so a
            generated client that offers no typed way to read that detail is the enforcement
            rather than a rule somebody has to remember.

  /userinfo:
    get:
      summary: The authenticated caller's OIDC profile claims
      description: >
        Added 2026-10-31 for frontend T30, as a decision rather than a drive-by (see this file's
        own description): /userinfo is called programmatically, so it qualifies, and frontend R20
        requires profile data to be read from here and never from the access token.

        Authenticated, and so the first operation in this file that is: POST /oauth2/token is
        security: [] because checky-spa is a public client proving itself with a PKCE verifier,
        while this one carries the tab's bearer and renews on 401 like any protected call.

        MEASURED against the running auth service on 2026-10-31, with a real interactive token
        from the full register-verify-TOTP-PKCE flow: this endpoint answers 200 with {"sub":
        "<uuid>"} and nothing else, although that token carries scope
        ["openid","profile","email"]. Spring Authorization Server returns only sub unless an OIDC
        user-info mapper is configured and auth-service configures none, which is recorded as
        spec/auth-service/design.md O6. Every claim but sub is therefore optional here - not as
        defensive schema-writing, but because a schema requiring more would make the live
        server's correct response a validation failure.
      operationId: getUserInfo
      # Kimi's phase 8, and it was right in a way that is easy to miss. The prose above said
      # "authenticated", and POST /oauth2/token says `security: []`, so the two LOOKED different. In
      # OpenAPI 3 they were not: an operation with no `security` inherits the global one, this file
      # declares no global one, and the result is no requirement at all - semantically identical to
      # `security: []`. The distinction existed only in the text, and a contract test could assert it
      # only textually. Declared properly now, so it is the document that says a bearer is required.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The caller's profile claims. Only sub is guaranteed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserInfoResponse'
        '302':
          description: >
            No bearer arrived. Documented deliberately, although it is not an error the SPA
            provokes, because leaving it out is what lets a reader assume 401 is the no-session
            answer - and it is not. MEASURED: a request with no Authorization header gets 302 with
            Location: /login and a Set-Cookie: JSESSIONID, so an unauthenticated read also starts
            a SAS session. fetch follows redirects by default, which turns this into 200
            text/html carrying the login page, for a client that would then try to parse it as
            the schema above. The caller sends redirect: 'manual' and treats any 3xx as no
            session (T30 AC12).

            302 is the only status MEASURED. The client deliberately handles the whole 3xx range
            anyway, which Kimi's phase 8 noted as a mismatch between this document and that code -
            correctly, and it is resolved in this direction rather than by narrowing the client. A
            redirect away from a protected endpoint means the session is gone whichever code SAS
            picks, and a client that accepted 302 while parsing a 303 as a profile would be a
            strange thing to have built on purpose.
        '401':
          description: >
            The bearer was present and unusable. The body is EMPTY and the detail is in a
            WWW-Authenticate header, which is why this response has no schema: MEASURED, that
            header reads error="invalid_token", error_description="An error occurred while
            attempting to decode the Jwt: Malformed token". L4 forbids the visitor learning which
            check failed, and a requirement written about response bodies would have missed this
            entirely. The caller surfaces none of it (T30 AC8).
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        The tab's in-memory access token, attached by the client boundary rather than by a caller
        (frontend L3, L18). Declared here rather than referenced from auth.yaml because
        openapi-typescript resolves no external $ref for security schemes, and a scheme that cannot
        be resolved is worse than one restated in six lines.
  schemas:
    TokenRequest:
      type: object
      description: >
        The form-encoded body. additionalProperties is false because the SPA controls this request
        completely and every field it carries is a field it meant to send.
      additionalProperties: false
      required: [grant_type, code, redirect_uri, client_id, code_verifier]
      properties:
        grant_type:
          type: string
          enum: [authorization_code]
        code:
          type: string
          description: The authorization code from the callback query.
        redirect_uri:
          type: string
          description: >
            Byte-identical to the one the authorize request sent; SAS matches it exactly against
            the registered value.
        client_id:
          type: string
        code_verifier:
          type: string
          description: The PKCE verifier stored when the authorize request was built.
    TokenResponse:
      type: object
      description: >
        Measured against the running auth service. There is no refresh_token field: checky-spa is
        registered with the refresh-token grant, but a real exchange issues none, which is the
        empirical basis for L3's silent re-authentication model. Its absence here is deliberate
        and is one of the ways that model is pinned.

        additionalProperties is left open, unlike the request: SAS owns what it sends, and closing
        this schema would assert something this repository does not control.
      required: [access_token, id_token, token_type, expires_in, scope]
      properties:
        access_token:
          type: string
        id_token:
          type: string
          description: Signed JWT. Its nonce claim is validated against the stored value (R7, T19).
        token_type:
          type: string
        expires_in:
          type: integer
          format: int32
        scope:
          type: string
    UserInfoResponse:
      type: object
      description: >
        The OIDC standard claims this client asks for, with the scopes openid profile email.

        sub is the only required property, and that is a measurement rather than caution: the
        running server returns exactly {"sub": "<uuid>"} today (O6). Any consumer must treat every
        other property as absent, and absence is not a failure.

        additionalProperties is left open, as TokenResponse's is and for the same reason: SAS owns
        what it sends. No property here is ever read from a token instead - frontend R20 forbids
        it and T30 proves it.
      required: [sub]
      properties:
        sub:
          type: string
          format: uuid
          description: The account UUID. Also present in the access token, where R20 forbids reading it.
        email:
          type: string
        email_verified:
          type: boolean
          description: >
            Whether the email is verified, as the profile endpoint reports it. NOT the access
            token's email_verified claim, which contracts/api/token-claims.md documents as
            reflecting scope authorization rather than verification state (frontend T32).
        name:
          type: string
        given_name:
          type: string
        family_name:
          type: string
        preferred_username:
          type: string
        picture:
          type: string
