[defaults]
inventory = inventory.ini
host_key_checking = False
retry_files_enabled = False
# The yaml stdout callback lived in community.general and was removed in its 10.0.0, so it is
# not a safe thing to depend on. ansible-core's own result_format gives the same readable
# multi-line output without a callback plugin at all.
stdout_callback = default
result_format = yaml
interpreter_python = auto_silent

[ssh_connection]
pipelining = True
