# Deployed configuration for the demo box. Values come from the environment so no key is written
# to disk in the repository; see infra/deploy/env.example.
#
# The chain is named ETHEREUM because that is what the Chain enum offers; the three URLs below
# point at Sepolia. Nothing in the service is testnet-aware - it asks whatever it is pointed at.
# A transaction verified here is a real Sepolia transaction, checkable on sepolia.etherscan.io.
#
# THESE ARE THREE DIFFERENT PROVIDERS ON PURPOSE. Locally all three point at one anvil node, so
# the quorum can never disagree and HELD is unreachable. Here they are independent, so 2-of-3 is
# a real vote and a genuine disagreement produces a genuine HELD.
themistra.crypto.providers.quorum-threshold=2
themistra.crypto.providers.chains[0].chain=ETHEREUM
themistra.crypto.providers.chains[0].providers[0].name=provider-a
themistra.crypto.providers.chains[0].providers[0].url=${SEPOLIA_RPC_1}
themistra.crypto.providers.chains[0].providers[0].timeout-seconds=10
themistra.crypto.providers.chains[0].providers[0].api-key-secret-name=demo-unused
themistra.crypto.providers.chains[0].providers[1].name=provider-b
themistra.crypto.providers.chains[0].providers[1].url=${SEPOLIA_RPC_2}
themistra.crypto.providers.chains[0].providers[1].timeout-seconds=10
themistra.crypto.providers.chains[0].providers[1].api-key-secret-name=demo-unused
themistra.crypto.providers.chains[0].providers[2].name=provider-c
themistra.crypto.providers.chains[0].providers[2].url=${SEPOLIA_RPC_3}
themistra.crypto.providers.chains[0].providers[2].timeout-seconds=10
themistra.crypto.providers.chains[0].providers[2].api-key-secret-name=demo-unused

# crypto-service requires three providers for every chain it knows. TRON keeps placeholders;
# nothing serves them, so a TRON lookup never succeeds here - which is correct, not a gap.
# TRON placeholders. This demo verifies Ethereum only, but ProviderSet requires exactly three
# providers for every chain in the Chain enum - QuorumEvaluator's 2-of-3 design hard-requires
# three answers (T16) - so TRON cannot simply be left out: dropping it fails startup with
# "must configure exactly 3 providers for chain TRON ... found 0".
#
# The endpoints carry NO scheme, which is the whole point. TronAdapterConfig builds a gRPC
# channel per provider, and gRPC's name resolver rejects an `http://` target outright: an earlier
# version of this file used http://127.0.0.1:9903 and brought the service down at startup with
# "Could not find a NameResolverProvider for http://127.0.0.1:9903". The local stack has always
# used bare host:port here; this now matches it.
#
# Nothing serves these ports, so a TRON lookup never progresses. gRPC channels connect lazily, so
# that costs nothing until something asks - and on this deployment nothing does.
themistra.crypto.providers.chains[1].chain=TRON
themistra.crypto.providers.chains[1].providers[0].name=tron-unconfigured-a
themistra.crypto.providers.chains[1].providers[0].url=localhost:9903
themistra.crypto.providers.chains[1].providers[0].timeout-seconds=5
themistra.crypto.providers.chains[1].providers[0].api-key-secret-name=demo-unused
themistra.crypto.providers.chains[1].providers[1].name=tron-unconfigured-b
themistra.crypto.providers.chains[1].providers[1].url=localhost:9904
themistra.crypto.providers.chains[1].providers[1].timeout-seconds=5
themistra.crypto.providers.chains[1].providers[1].api-key-secret-name=demo-unused
themistra.crypto.providers.chains[1].providers[2].name=tron-unconfigured-c
themistra.crypto.providers.chains[1].providers[2].url=localhost:9906
themistra.crypto.providers.chains[1].providers[2].timeout-seconds=5
themistra.crypto.providers.chains[1].providers[2].api-key-secret-name=demo-unused

themistra.crypto.finality.enabled-chains[0]=ETHEREUM
themistra.crypto.finality.enabled-chains[1]=TRON

# The one token the demo can name. crypto-service decides whether a token is allowlisted; anything
# else verifies as UNKNOWN_TOKEN, with the amount shown and the token deliberately unnamed.
themistra.crypto.token-allowlist.entries[0].chain=ETHEREUM
themistra.crypto.token-allowlist.entries[0].contract-address=${DEMO_TOKEN_ADDRESS}
themistra.crypto.token-allowlist.entries[0].symbol=${DEMO_TOKEN_SYMBOL:USDC}
themistra.crypto.token-allowlist.entries[0].decimals=${DEMO_TOKEN_DECIMALS:6}
themistra.crypto.token-allowlist.entries[0].version=1
themistra.crypto.token-allowlist.entries[0].signature=demo-unsigned-placeholder

# Screening is not part of the lookup path this demo exposes; the stub clears every sender.
# fail-closed, which is the default in every environment and the only mode legal outside local
# development: LocalDevScreeningClient throws "themistra.crypto.screening.mode=local-dev is for
# local development only" at construction, which took crypto-service down on this box. The
# fail-closed stub screens nothing against a real vendor and records ERROR, which is the honest
# outcome when no screening vendor is configured. It does not affect this demo: the transaction
# lookup path is read-only and never screens - screening belongs to the attestation and watch
# paths, which nothing here exercises.

themistra.crypto.adapter.ethereum.poll-interval-ms=5000
themistra.crypto.watcher.finality-poll-interval-ms=15000
themistra.crypto.watcher.reconciliation-interval-ms=15000
