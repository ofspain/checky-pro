# infra/local only: crypto-service against the local anvil chain. Loaded through
# SPRING_CONFIG_ADDITIONAL_LOCATION, so each list below replaces the one in application.properties.
# The three Ethereum providers are the same anvil node, so quorum always agrees. crypto-service
# requires three providers for every chain, so TRON keeps its placeholders; nothing serves them, so a
# TRON invoice never progresses locally.
themistra.crypto.providers.chains[0].chain=ETHEREUM
themistra.crypto.providers.chains[0].providers[0].name=anvil-a
themistra.crypto.providers.chains[0].providers[0].url=http://anvil:8545
themistra.crypto.providers.chains[0].providers[0].timeout-seconds=5
themistra.crypto.providers.chains[0].providers[0].api-key-secret-name=local-only-fake-provider-key
themistra.crypto.providers.chains[0].providers[1].name=anvil-b
themistra.crypto.providers.chains[0].providers[1].url=http://anvil:8545
themistra.crypto.providers.chains[0].providers[1].timeout-seconds=5
themistra.crypto.providers.chains[0].providers[1].api-key-secret-name=local-only-fake-provider-key
themistra.crypto.providers.chains[0].providers[2].name=anvil-c
themistra.crypto.providers.chains[0].providers[2].url=http://anvil:8545
themistra.crypto.providers.chains[0].providers[2].timeout-seconds=5
themistra.crypto.providers.chains[0].providers[2].api-key-secret-name=local-only-fake-provider-key
themistra.crypto.providers.chains[1].chain=TRON
themistra.crypto.providers.chains[1].providers[0].name=fake-tron-provider-a
themistra.crypto.providers.chains[1].providers[0].url=localhost:9903
themistra.crypto.providers.chains[1].providers[0].timeout-seconds=5
themistra.crypto.providers.chains[1].providers[0].api-key-secret-name=local-only-fake-provider-key
themistra.crypto.providers.chains[1].providers[1].name=fake-tron-provider-b
themistra.crypto.providers.chains[1].providers[1].url=localhost:9904
themistra.crypto.providers.chains[1].providers[1].timeout-seconds=5
themistra.crypto.providers.chains[1].providers[1].api-key-secret-name=local-only-fake-provider-key
themistra.crypto.providers.chains[1].providers[2].name=fake-tron-provider-c
themistra.crypto.providers.chains[1].providers[2].url=localhost:9906
themistra.crypto.providers.chains[1].providers[2].timeout-seconds=5
themistra.crypto.providers.chains[1].providers[2].api-key-secret-name=local-only-fake-provider-key
themistra.crypto.finality.enabled-chains[0]=ETHEREUM
themistra.crypto.finality.enabled-chains[1]=TRON

themistra.crypto.token-allowlist.entries[0].chain=ETHEREUM
themistra.crypto.token-allowlist.entries[0].contract-address=0x5fbdb2315678afecb367f032d93f642f64180aa3
themistra.crypto.token-allowlist.entries[0].symbol=USDC
themistra.crypto.token-allowlist.entries[0].decimals=6
themistra.crypto.token-allowlist.entries[0].version=1
themistra.crypto.token-allowlist.entries[0].signature=local-only-unsigned-placeholder

themistra.crypto.kms.key-id=00000000-0000-4000-8000-000000000001
themistra.crypto.snapshot.bucket=themistra-local-observations

# Faster than the production defaults, so a local payment moves in seconds.
themistra.crypto.adapter.ethereum.poll-interval-ms=2000
themistra.crypto.watcher.finality-poll-interval-ms=5000
themistra.crypto.watcher.reconciliation-interval-ms=3000

# Screening: the local-dev stub (LocalDevScreeningClient) clears every sender except anvil
# account 2, which screens as BLOCKED, so `bin/chain pay-blocked` produces a HELD payment.
themistra.crypto.screening.mode=local-dev
# Comma-separated: the stub reads this with @Value, which cannot bind the indexed [0] form.
themistra.crypto.screening.local-dev.blocked-addresses=0x3C44CdDdB6a900fa2b585dd299e03d12FA4293BC
